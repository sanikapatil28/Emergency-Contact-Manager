<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Family Contact</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    {% include 'navbar.html' %}

<div class="dashboard">

    <header class="dashboard-header">

        <div>
            <h1>🚨 Emergency Contact Manager</h1>
            <p>Edit Family Contact</p>
        </div>

        <a href="/family-contacts" class="logout-btn">
            Back
        </a>

    </header>


    <main class="dashboard-content">

        <div class="contact-form-card edit-card">

            <h2>✏️ Edit Family Contact</h2>

            <p class="edit-description">
                Update the contact information below.
            </p>

            <form method="POST">

                <div class="form-group">

                    <label>Name</label>

                    <input
                        type="text"
                        name="name"
                        value="{{ contact.name }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Relationship</label>

                    <select name="relationship" required>

                        <option value="Father"
                            {% if contact.relationship == "Father" %}selected{% endif %}>
                            Father
                        </option>

                        <option value="Mother"
                            {% if contact.relationship == "Mother" %}selected{% endif %}>
                            Mother
                        </option>

                        <option value="Brother"
                            {% if contact.relationship == "Brother" %}selected{% endif %}>
                            Brother
                        </option>

                        <option value="Sister"
                            {% if contact.relationship == "Sister" %}selected{% endif %}>
                            Sister
                        </option>

                        <option value="Grandfather"
                            {% if contact.relationship == "Grandfather" %}selected{% endif %}>
                            Grandfather
                        </option>

                        <option value="Grandmother"
                            {% if contact.relationship == "Grandmother" %}selected{% endif %}>
                            Grandmother
                        </option>

                        <option value="Uncle"
                            {% if contact.relationship == "Uncle" %}selected{% endif %}>
                            Uncle
                        </option>

                        <option value="Aunt"
                            {% if contact.relationship == "Aunt" %}selected{% endif %}>
                            Aunt
                        </option>

                        <option value="Other"
                            {% if contact.relationship == "Other" %}selected{% endif %}>
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Phone Number</label>

                    <input
                        type="tel"
                        name="phone"
                        value="{{ contact.phone }}"
                        required
                    >

                </div>


                <button type="submit" class="btn-primary">
                    💾 Update Contact
                </button>

            </form>

        </div>

    </main>

</div>

</body>

</html>
